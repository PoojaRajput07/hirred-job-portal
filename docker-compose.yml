
services:
  backend:
    build: ./backend
    image: hired-backend:latest
    container_name: hirred-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: hirred-frontend:latest
    container_name: hirred-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
